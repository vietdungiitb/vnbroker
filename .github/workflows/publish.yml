name: Publish to PyPI

# CHỈ publish khi người dùng chủ động:
#   - tạo GitHub Release (tag annotated vX.Y.Z)  -> publish lên PyPI thật
#   - chạy tay (workflow_dispatch)               -> mặc định TestPyPI để thử trước
# Không có trigger push/PR: không bao giờ tự đẩy lên index công khai.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      confirm_version:
        description: "Gõ đúng version trong pyproject.toml (ví dụ 3.5.0) để xác nhận"
        required: true
        type: string
      target:
        description: "Nơi publish"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  build:
    name: Build + verify distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build + test dependencies
        run: |
          python -m pip install --upgrade pip build twine
          pip install -e ".[test]"

      - name: Read version from pyproject.toml (single source of truth)
        id: ver
        run: |
          python -c "import tomllib,pathlib,os; v=tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']; open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8').write('version='+v+'\n')"

      # Cổng 1 — release phải khớp version trong code, nếu không artifact gắn sai nhãn.
      - name: Verify version matches the release tag
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VER="${{ steps.ver.outputs.version }}"
          echo "tag=$TAG version=$VER"
          if [ "$TAG" != "v$VER" ]; then
            echo "::error::tag '$TAG' không khớp pyproject version '$VER' (mong đợi v$VER)"
            exit 1
          fi

      - name: Verify the typed confirmation matches the version
        if: github.event_name == 'workflow_dispatch'
        run: |
          GOT="${{ inputs.confirm_version }}"
          VER="${{ steps.ver.outputs.version }}"
          if [ "$GOT" != "$VER" ]; then
            echo "::error::xác nhận '$GOT' không khớp pyproject version '$VER'"
            exit 1
          fi

      # Cổng 2 — suite thật, chạy trên đúng commit sẽ được phát hành.
      # `--maxfail=1`: đỏ ở test đầu là dừng, không đốt quota runner cho phần còn lại.
      - name: Run unit + contract tests
        run: |
          pytest tests/unit tests/contract -q --timeout=120 --maxfail=1

      - name: Build sdist and wheel
        run: |
          rm -rf dist
          python -m build

      # Cổng 3 — artifact thật phải chỉ chứa package thư viện.
      # `twine check` KHÔNG kiểm danh sách file, nên cần cổng riêng này.
      - name: Check distribution contents (no tests/docs/scripts in wheel)
        run: |
          python scripts/check_dist_contents.py dist/

      - name: Twine check (metadata + README render)
        run: |
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'release' || inputs.target == 'pypi') && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write # dùng Trusted Publishing nếu repo được chuyển sang public
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Báo lỗi rõ ràng khi thiếu token, thay vì để action thất bại khó hiểu.
      # (Repo private nên chưa dùng được Trusted Publishing / OIDC.)
      - name: Verify the API token secret exists
        env:
          TARGET: ${{ (github.event_name == 'release' || inputs.target == 'pypi') && 'pypi' || 'testpypi' }}
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          TESTPYPI_TOKEN: ${{ secrets.TESTPYPI_API_TOKEN }}
        run: |
          if [ "$TARGET" = "pypi" ]; then
            if [ -z "$PYPI_TOKEN" ]; then
              echo "::error::Thiếu secret PYPI_API_TOKEN. Xem docs/PUBLISHING.md."
              exit 1
            fi
            echo "PYPI_API_TOKEN: đã cấu hình (${#PYPI_TOKEN} ký tự)"
          else
            if [ -z "$TESTPYPI_TOKEN" ]; then
              echo "::error::Thiếu secret TESTPYPI_API_TOKEN. Xem docs/PUBLISHING.md."
              exit 1
            fi
            echo "TESTPYPI_API_TOKEN: đã cấu hình (${#TESTPYPI_TOKEN} ký tự)"
          fi

      # Repo đang PRIVATE nên Trusted Publishing (OIDC) chưa dùng được.
      # Cần secret PYPI_API_TOKEN (và TESTPYPI_API_TOKEN khi thử).
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TESTPYPI_API_TOKEN }}

      - name: Publish to PyPI
        if: github.event_name == 'release' || inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
