name: Nightly Auto-Tune Concurrency

# Runs every night at 01:00 UTC (08:00 ICT) — before VN market open.
# Produces CSV + JSON artifacts showing the optimal concurrency level
# for each provider at the current network conditions.
on:
  schedule:
    - cron: '0 1 * * 1-5'      # Mon–Fri 01:00 UTC (weekdays only)
  workflow_dispatch:             # allow manual trigger from GitHub UI
    inputs:
      concurrency_grid:
        description: 'Comma-separated concurrency values to test'
        required: false
        default: '4,8,12,16,24'
      symbols:
        description: 'Comma-separated symbols to test against'
        required: false
        default: 'ACB,VCB,TCB,HPG,VNM,BID,CTG,FPT,MWG,SSI'

jobs:
  autotune:
    name: Auto-tune (${{ matrix.provider }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [vci, kbs]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      # Run with stats disabled for maximum accuracy of concurrency measurement.
      - name: Run auto-tune — ${{ matrix.provider }}
        env:
          VNSTOCK_ASYNC_STATS_ENABLED: '0'
        run: |
          CONCURRENCY="${{ github.event.inputs.concurrency_grid || '4,8,12,16,24' }}"
          SYMBOLS="${{ github.event.inputs.symbols || 'ACB,VCB,TCB,HPG,VNM,BID,CTG,FPT,MWG,SSI' }}"
          python -m tests.examples.auto_tune_concurrency \
            --provider ${{ matrix.provider }} \
            --symbols "$SYMBOLS" \
            --concurrency "$CONCURRENCY" \
            --runs 2 \
            --output-csv tmp/autotune_${{ matrix.provider }}.csv \
            --output-json tmp/autotune_${{ matrix.provider }}.json

      - name: Upload tune results
        uses: actions/upload-artifact@v4
        with:
          name: autotune-${{ matrix.provider }}-${{ github.run_number }}
          path: |
            tmp/autotune_${{ matrix.provider }}.csv
            tmp/autotune_${{ matrix.provider }}.json
          retention-days: 30
          if-no-files-found: warn

  # Aggregate both provider results and post a PR comment / job summary.
  summarise:
    name: Post summary
    runs-on: ubuntu-latest
    needs: autotune
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: tmp/artifacts

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install tabulate

      - name: Build GitHub job summary
        run: |
          python - <<'EOF'
          import json, pathlib, sys
          try:
              from tabulate import tabulate
          except ImportError:
              tabulate = None

          rows = []
          for p in ["vci", "kbs"]:
              pat = list(pathlib.Path("tmp/artifacts").rglob(f"autotune_{p}.json"))
              if not pat:
                  continue
              data = json.loads(pat[0].read_text())
              for entry in data:
                  rows.append([
                      entry.get("provider", p).upper(),
                      entry.get("concurrency", "?"),
                      f"{entry.get('rps', 0):.2f}",
                      f"{entry.get('rpm', 0):.0f}",
                      f"{entry.get('p50_seconds', 0)*1000:.0f} ms",
                      f"{entry.get('p95_seconds', 0)*1000:.0f} ms",
                      entry.get("errors", 0),
                  ])

          headers = ["Provider", "Concurrency", "RPS", "RPM", "P50", "P95", "Errors"]
          if rows:
              if tabulate:
                  table = tabulate(rows, headers=headers, tablefmt="github")
              else:
                  table = "\n".join([" | ".join(headers)] + [" | ".join(str(c) for c in r) for r in rows])
          else:
              table = "_No results collected._"

          summary_path = pathlib.Path(sys.argv[1] if len(sys.argv) > 1 else "/dev/stdout")
          summary_path.write_text(f"## Nightly Auto-Tune Results\n\n{table}\n")
          EOF
          python /dev/stdin "$GITHUB_STEP_SUMMARY"  || \
            python - "$GITHUB_STEP_SUMMARY" << 'EOF'
          import json, pathlib, sys
          try:
              from tabulate import tabulate
          except ImportError:
              tabulate = None

          rows = []
          for p in ["vci", "kbs"]:
              pat = list(pathlib.Path("tmp/artifacts").rglob(f"autotune_{p}.json"))
              if not pat:
                  continue
              data = json.loads(pat[0].read_text())
              for entry in data:
                  rows.append([
                      entry.get("provider", p).upper(),
                      entry.get("concurrency", "?"),
                      f"{entry.get('rps', 0):.2f}",
                      f"{entry.get('rpm', 0):.0f}",
                      f"{entry.get('p50_seconds', 0)*1000:.0f} ms",
                      f"{entry.get('p95_seconds', 0)*1000:.0f} ms",
                      entry.get("errors", 0),
                  ])

          headers = ["Provider", "Concurrency", "RPS", "RPM", "P50", "P95", "Errors"]
          if rows:
              if tabulate:
                  table = tabulate(rows, headers=headers, tablefmt="github")
              else:
                  table = "\n".join([" | ".join(headers)] + [" | ".join(str(c) for c in r) for r in rows])
          else:
              table = "_No results collected._"

          out = sys.argv[1] if len(sys.argv) > 1 else None
          if out:
              pathlib.Path(out).write_text(f"## Nightly Auto-Tune Results\n\n{table}\n")
          else:
              print(table)
          EOF

      - name: Upload combined summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: autotune-summary-${{ github.run_number }}
          path: tmp/artifacts/
          retention-days: 90
          if-no-files-found: warn
