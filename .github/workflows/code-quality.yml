name: Code Quality Checks

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test,lint]"
        pip install flake8 pylint black isort
    
    - name: Type check (mypy strict, baseline-gated)
      run: |
        python scripts/check_mypy_baseline.py

    - name: Lint with flake8 (syntax errors + undefined names are blocking)
      run: |
        flake8 vnbroker --count --select=E9,F63,F7,F82 --show-source --statistics
      # Full style report stays advisory — the rule set is being reduced (GĐ4).
      continue-on-error: true
    
    - name: Check code formatting with black
      run: |
        black --check vnbroker --diff
      continue-on-error: true
    
    - name: Check import sorting with isort
      run: |
        isort --check-only vnbroker --diff
      continue-on-error: true
    
    - name: Type baseline check (fail on new mypy --strict errors)
      run: |
        python scripts/check_mypy_baseline.py
    
    - name: Version sync check (docs must match pyproject.toml)
      run: |
        python scripts/check_version_sync.py

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
    
    - name: Run Bandit security scan
      run: |
        bandit -r vnbroker -f json -o bandit-report.json 2>&1 | head -50
      continue-on-error: true
    
    - name: Check dependencies with Safety
      run: |
        safety check --json 2>&1 | head -50
      continue-on-error: true
    
    - name: Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: bandit-report.json
      continue-on-error: true

  dependencies:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Check for outdated dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit
        pip-audit --desc
      continue-on-error: true
