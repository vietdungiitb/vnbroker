name: Comprehensive Test Suite

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  schedule:
    # Hằng tuần (Thứ Hai 02:00 UTC) thay vì hằng ngày. Trên repo PRIVATE mỗi phút
    # runner đều tính quota, và suite đã chạy mỗi lần push rồi — bản theo lịch
    # chỉ để bắt lỗi phụ thuộc thời gian (provider đổi schema, rate limit).
    - cron: '0 2 * * 1'

jobs:
  # Quyết định matrix Python theo ngữ cảnh chạy.
  #
  # Tách thành job riêng để logic nằm trong SHELL — kiểm chứng được ở máy —
  # thay vì biểu thức `${{ }}` của GitHub, thứ không chạy được ngoài CI và
  # hỏng âm thầm (matrix sai vẫn xanh, chỉ là chạy thiếu phiên bản).
  plan:
    runs-on: ubuntu-latest
    outputs:
      pythons: ${{ steps.matrix.outputs.pythons }}
    steps:
      - id: matrix
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo 'pythons=["3.10","3.11","3.12","3.13"]' >> "$GITHUB_OUTPUT"
          else
            # dev/PR: chỉ hai đầu của requires-python (>=3.10) — tín hiệu nhanh.
            echo 'pythons=["3.10","3.13"]' >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS bị bỏ khỏi matrix: runner macOS tính hệ số tiêu thụ quota cao
        # nhất trong ba OS, trong khi dự án không có code phụ thuộc macOS
        # (`Operating System :: OS Independent`). Mọi workflow khác đã chỉ chạy
        # `ubuntu-latest`.
        os: [ubuntu-latest, windows-latest]
        python-version: ${{ fromJSON(needs.plan.outputs.pythons) }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e ".[test,lint]"
        pip install pytest-xdist pytest-timeout pytest-mock pytest-rerunfailures
    
    - name: Run unit tests
      run: |
        pytest tests/unit/ -v --tb=short --timeout=60 -n auto --durations=10 --reruns 2 --reruns-delay 5
      env:
        PYTEST_CURRENT_TEST: true
        CI: true

    # Hợp đồng kiến trúc hai tầng (GĐ1–GĐ3): mọi provider ẩn danh phải trả
    # cùng schema, và failover phải xoay vòng đúng. KHÔNG continue-on-error:
    # đây là thứ bảo vệ toàn bộ phần data layer.
    - name: Run architecture contract tests
      run: |
        pytest tests/contract/ -v --tb=short --timeout=60

    # GĐ4: ruff trước đây KHÔNG có trong CI và không có [tool.ruff], nên 2888
    # lỗi tồn tại mà không ai chặn. Rule set nay nhỏ và có chủ đích; chạy
    # không continue-on-error để baseline không trôi ngược.
    - name: Lint with ruff
      run: |
        ruff check vnbroker tests/unit tests/contract/
    
    - name: Run integration tests
      run: |
        pytest tests/integration/ -v --tb=short --timeout=120 --maxfail=5
      continue-on-error: true
      env:
        PYTEST_XDIST_WORKER_COUNT: 2
    
    - name: Generate coverage report
      run: |
        pip install pytest-cov
        pytest tests/ --cov=vnbroker --cov-report=xml --cov-report=term-missing --timeout=60 -x
      continue-on-error: true
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"
        pip install flake8 pylint black isort mypy
    
    - name: Lint with flake8
      run: |
        flake8 vnbroker --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 vnbroker --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true
    
    - name: Check code formatting with black
      run: |
        black --check vnbroker --diff
      continue-on-error: true
    
    - name: Check import sorting with isort
      run: |
        isort --check-only vnbroker --diff
      continue-on-error: true
    
    - name: Type checking with mypy
      run: |
        mypy vnbroker --ignore-missing-imports --no-error-summary
      continue-on-error: true

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
    
    - name: Run Bandit security scan
      run: |
        bandit -r vnbroker -f json -o bandit-report.json
      continue-on-error: true
    
    - name: Check dependencies with Safety
      run: |
        safety check --json
      continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: [test, code-quality]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel build
    
    - name: Build package
      run: |
        python -m build
    
    - name: Check package with twine
      run: |
        pip install twine
        twine check dist/*
      continue-on-error: true
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  test-report:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    
    steps:
    - name: Download coverage reports
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        pattern: coverage-*
        merge-multiple: true
    
    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: |
          **/test-results.xml
      continue-on-error: true
