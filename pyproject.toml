[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vnbroker"
version = "3.3.0"
description = "A beginner-friendly yet powerful Python toolkit for financial analysis and automation — built to make modern investing accessible to everyone"
readme = "README.md"
authors = [
  { name = "Pham Viet Dung", email = "vietdungiitb@gmail.com" },
]
license = { text = "Custom: Personal, research, non-commercial; contact vietdungiitb@gmail.com for other use" }
requires-python = ">=3.10"
keywords = ["vnbroker", "finance", "vietnam", "stock market", "analysis", "API", "DNSE", "broker"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Software Development :: Libraries",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "License :: Other/Proprietary License",
    "Natural Language :: Vietnamese",
    "Natural Language :: English",
]
dependencies = [
    "requests",
    "beautifulsoup4",
    "pandas",
    "openpyxl",
    "pydantic",
    "pytz",
    "psutil",
    "packaging>=20.0",
    "importlib-metadata>=1.0",
    "tenacity",
    "httpx[http2]>=0.27.0",
    "fake_useragent>=1.5.1",
    "cryptography>=42.0.5",
    "websockets>=12.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov>=4.0", "pytest-timeout"]

[project.urls]
Documentation = "https://vnstocks.com/docs"
Source = "https://github.com/vietdungiitb/vnbroker"
IssueTracker = "https://github.com/vietdungiitb/vnbroker/issues"

[tool.setuptools]
include-package-data = true
packages = { find = {} }

[tool.setuptools.package-data]
vnbroker = ["docs/*.txt", "docs/*.csv"]
