[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vnbroker"
version = "3.5.0"
description = "A beginner-friendly yet powerful Python toolkit for financial analysis and automation — built to make modern investing accessible to everyone"
readme = "README.md"
authors = [
  { name = "Pham Viet Dung", email = "vietdungiitb@gmail.com" },
]
# PEP 639: dùng SPDX expression + license-files. Trước đây là TOML table
# (`license = { text = ... }`) + classifier `License :: Other/Proprietary
# License` — setuptools đã deprecate cả hai và hạn cứng 2027-02-18; metadata
# sinh ra chứa đồng thời `License:` (free text) và `License-File:`, đúng ca mà
# core-metadata 2.4 nói PyPI từ chối. `LicenseRef-Proprietary` là dạng hợp lệ
# cho giấy phép không thuộc SPDX license list (LICENSE.md của dự án).
license = "LicenseRef-Proprietary"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
keywords = ["vnbroker", "finance", "vietnam", "stock market", "analysis", "API", "DNSE", "broker"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Software Development :: Libraries",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Natural Language :: Vietnamese",
    "Natural Language :: English",
]
dependencies = [
    "requests",
    "beautifulsoup4",
    "pandas",
    "openpyxl",
    "pydantic",
    "pytz",
    "psutil",
    "packaging>=20.0",
    "importlib-metadata>=1.0",
    "tenacity",
    "httpx[http2]>=0.27.0",
    "fake_useragent>=1.5.1",
    "cryptography>=42.0.5",
    "websockets>=12.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov>=4.0", "pytest-timeout"]
lint = [
    "mypy>=1.10",
    "ruff>=0.4.0",
    # Stub types BẮT BUỘC: không có chúng, số lỗi mypy phụ thuộc môi trường —
    # CI (Python 3.11) và máy dev (3.13) cho kết quả khác nhau với cùng một
    # commit, khiến baseline gate báo sai. Đây là nguyên nhân 14 lỗi "mới" ở
    # CI lúc đóng gói v3.5.0 trong khi máy local báo 0.
    "types-requests>=2.31",
    "types-beautifulsoup4",
    "types-python-dateutil",
    "types-pytz",
]

[project.urls]
Documentation = "https://github.com/vietdungiitb/vnbroker/tree/main/docs"
Source = "https://github.com/vietdungiitb/vnbroker"
IssueTracker = "https://github.com/vietdungiitb/vnbroker/issues"

[tool.setuptools]
include-package-data = true

# CHỈ đóng gói package thật của thư viện.
#
# `packages = { find = {} }` (dạng cũ, không có `namespaces`) bị setuptools
# phân giải thành PEP420 namespace finder — mà finder này có DEFAULT_EXCLUDE
# RỖNG, không loại trừ `tests`/`scripts`/`docs` như FlatLayoutPackageFinder.
# Hệ quả đo được trên bản build v3.5.0:
#   - wheel: `tests/` 155 file + `scripts/` 2 file nằm ở top-level site-packages
#     -> top_level.txt = ['docs', 'scripts', 'tests', 'vnbroker']
#   - `build/` cũ trên máy dev bị quét theo, nên cùng một commit cho artifact
#     khác nhau: 740,433 B (có 13 file docs/debug_*.py) vs 732,254 B (clone sạch)
# `include` chặn cả hai: chỉ `vnbroker*`, không phụ thuộc cây làm việc.
#
# LƯU Ý: `packages.find.include` CHỈ áp cho wheel. Sdist lấy file theo
# `MANIFEST.in` + glob của egg_info, và setuptools chỉ ĐỌC LẠI
# `vnbroker.egg-info/SOURCES.txt` ở các lần build sau — nên file rác lọt vào một
# lần sẽ đi vào mọi sdist tiếp theo. Vì vậy `docs/` bị `prune` trong MANIFEST.in
# và có cổng chặn riêng.
#
# Cổng chặn: scripts/check_dist_contents.py (chạy trong .github/workflows/publish.yml).
[tool.setuptools.packages.find]
include = ["vnbroker*"]

[tool.setuptools.package-data]
vnbroker = ["docs/*.txt", "docs/*.csv"]

[tool.ruff]
# GĐ4: trước đây ruff chạy với ruleset mặc định và KHÔNG có trong CI, nên
# 2888 lỗi tồn tại mà không ai chặn. Ở đây khóa một rule set nhỏ, có chủ đích,
# gồm các lớp lỗi thật sự nguy hiểm (undefined name, unused import, mutable
# default). Mở rộng dần khi baseline về 0.
target-version = "py310"
line-length = 127
exclude = [".venv", "build", "dist", "__pycache__", "vnbroker.egg-info"]

[tool.ruff.lint]
select = [
    "E9",    # syntax error
    "F821",  # undefined name  -> NameError lúc runtime
    "F401",  # unused import
    "F841",  # unused local variable
    "B006",  # mutable argument default
    "B008",  # function call trong default arg
]
# S110 (try/except/pass) bị bật nhưng hạ xuống cảnh báo: phần lớn là
# best-effort có chủ đích — ví dụ `source_router._persist_state` bỏ qua lỗi ghi
# DB (cooldown state chỉ là tối ưu, mất nó không sai dữ liệu), và
# `upgrade._check_dependency_compatibility` bỏ qua package chưa cài.
# Nuốt lỗi ở những chỗ đó là đúng; sửa máy sẽ gây rủi ro lớn hơn lợi ích.
# Đưa vào danh sách theo file khi rà tới chỗ cụ thể.
ignore = ["S110"]

[tool.ruff.lint.per-file-ignores]
# Test dùng assert và import cố ý.
"tests/**" = ["S101", "B011"]

[tool.mypy]
# Canonical mypy config (pyproject.toml.testing holds legacy test/lint extras).
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
ignore_missing_imports = true

# NOTE: global --strict is NOT enabled here. The legacy strict-error surface
# (~550 errors, expiry 2026-12-31) is tracked via
# artifacts/v3.4-roadmap/mypy-baseline.txt and enforced by
# `python scripts/check_mypy_baseline.py`, which fails CI on NEW
# `mypy vnbroker --strict` errors. Fix-then-shrink the baseline; do not
# add new strict errors outside it.
[[tool.mypy.overrides]]
module = [
    "vnbroker.core.health_store",
    "vnbroker.connector.binance.*",
    "vnbroker.explorer.tcbs.websocket",
    "vnbroker.explorer.tcbs.ws_models",
]
strict = true
