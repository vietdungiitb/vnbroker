[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vninvest-sdk"
version = "0.2.0"
description = "Vninvest SaaS SDK - Enterprise wrapper for vnbroker with tenant isolation, quota management, PAT authentication, and observability"
readme = "README.md"
authors = [{name = "Vninvest Team", email = "support@vninvest.vn"}]
license = {text = "Proprietary - Internal Use Only"}
requires-python = ">=3.10"
keywords = ["vninvest", "vnbroker", "fintech", "saas", "vietnam-stock-market"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Software Development :: Libraries",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "vnbroker>=1.0.2",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "redis>=5.0",
    "httpx>=0.27",
    "tenacity>=8.0",
    "python-json-logger>=2.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
    "prometheus-client>=0.19",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "bcrypt>=4.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "httpx-mock>=0.7",
    "fakeredis>=2.20",
    "ruff>=0.4",
    "mypy>=1.10",
    "black>=24.0",
    "isort>=5.13",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-openapi>=1.2",
]

[project.urls]
Homepage = "https://vninvest.vn"
Repository = "https://github.com/vninvest/vninvest-sdk"
Documentation = "https://docs.vninvest.vn/sdk"
Changelog = "https://github.com/vninvest/vninvest-sdk/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["vninvest*", "vninvest_fastapi*"]

[tool.setuptools.package-data]
vninvest = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20", "PTH", "ERA", "PL", "TRY"]
ignore = ["S101", "TRY003", "B008", "PLR0913"]
per-file-ignores = { "tests/*" = ["S101", "PLR2004", "B008", "PLR0913"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
strict_optional = true
no_implicit_optional = false
check_untyped_defs = false
enable_error_code = ["unused-ignore", "redundant-expr"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["vninvest", "vninvest_fastapi"]
omit = ["tests/*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]